# /etc/nginx/sites-available/polypanel
# Reverse proxy for PolyPanel. Bind the app to 127.0.0.1:3000 so only nginx
# can reach it; run `certbot --nginx -d panel.example.com` to provision TLS and
# the 80->443 redirect (it rewrites this file in place).
server {
    server_name panel.example.com;

    # Optional belt-and-suspenders: nginx HTTP basic auth in addition to (or
    # instead of) the app-level session. Uncomment + create the htpasswd file.
    # auth_basic "PolyPanel";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # certbot adds the listen 443 / ssl_certificate lines here.
    listen 80;
}

# After certbot runs, it injects an HTTP->HTTPS redirect server block and HSTS
# can be added to the 443 block:
#   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
